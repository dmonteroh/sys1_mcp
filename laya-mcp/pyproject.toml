[project]
name = "ld-laya-mcp"
version = "0.1.0"
description = "First-party stdio MCP server wrapping the laya-mlx runtime."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.5",
    "laya-mlx>=0.1.0",
    "httpx>=0.27",
]

[project.scripts]
laya-mcp = "laya_mcp:main"
laya-mcp-http = "laya_mcp.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_mcp"]
