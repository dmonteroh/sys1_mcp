[project]
name = "sys1-mcp"
version = "0.2.0"
description = "Model-agnostic MCP server for System One typed-decision models (Laya in-process, or any /v1/systemone endpoint)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.5",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
# The default `laya-mlx` backend, which runs Laya in this process on Apple Silicon.
laya = ["laya-mlx>=0.1.0"]

[project.scripts]
sys1-mcp = "sys1_mcp:main"
sys1-mcp-http = "sys1_mcp.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sys1_mcp"]
